database:
  path: fullmute.db
logging:
  backups: 5
  file: ./logs/fullmute.log
  level: INFO
  max_mb: 50
scanner:
  bypass_cloudflare: false
  max_concurrent: 20
  max_delay: 0.6
  max_retries: 3
  min_delay: 0.2
  nvd_api_key: ''
  nvd_initial_delay: 0.7
  nvd_max_retries: 3
  port_scan:
    enabled: true
    ports:
    - 21
    - 22
    - 23
    - 25
    - 53
    - 80
    - 110
    - 139
    - 143
    - 443
    - 445
    - 993
    - 995
    - 1433
    - 1521
    - 3306
    - 3389
    - 5432
    - 5900
    - 8080
    timeout: 3.0
    with_cves: true
    with_exploits: true
  proxy_enabled: false
  proxy_file: proxies.txt
  rotate_user_agents: true
  search_exploits: true
  test_default_credentials: true
  timeout: 15
  verify_ssl: false
signatures:
  path: ./config/signatures
