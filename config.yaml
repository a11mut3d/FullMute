database:
  path: fullmute.db
logging:
  backups: 5
  file: ./logs/fullmute.log
  level: INFO
  max_mb: 50
scanner:
  nuclei_enabled: false
  nuclei_binary: nuclei
  nuclei_templates_path: './nuclei-templates'
  nuclei_timeout: 120
  allowed_private_networks: []
  bypass_cloudflare: false
  max_concurrent: 5
  max_delay: 2.0
  max_retries: 3
  min_delay: 0.5
  nvd_api_key: ''
  nvd_initial_delay: 1.0
  nvd_max_retries: 3
  cve_cache_ttl: 86400
  negative_cve_cache_ttl: 21600
  exploit_cache_ttl: 86400
  nuclei_template_cache_ttl: 86400
  port_scan:
    enabled: true
    ports:
    - 21
    - 22
    - 23
    - 25
    - 53
    - 80
    - 110
    - 139
    - 143
    - 443
    - 445
    - 993
    - 995
    - 1433
    - 1521
    - 3306
    - 3389
    - 5432
    - 5900
    - 8080
    timeout: 5.0
    with_cves: true
    with_exploits: true
  proxy_enabled: false
  proxy_file: proxies.txt
  rotate_user_agents: true
  search_exploits: true
  test_default_credentials: true
  login_path_probe_concurrency: 8
  max_response_bytes: 5242880
  sensitive_file_concurrency: 8
  timeout: 15
  tech_detection_timeout: 15
  tech_detection_max_html: 2000000
  verify_ssl: false
signatures:
  path: ./config/signatures
