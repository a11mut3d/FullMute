{% extends "base.html" %}

{% block title %}404 - Not Found | FullMute Web{% endblock %}

{% block body %}
<div class="min-h-screen flex items-center justify-center bg-dark-bg">
    <div class="text-center px-4">
        <!-- Simple Icon -->
        <div class="mb-6">
            <i class="fas fa-search text-6xl text-primary-500"></i>
        </div>

        <!-- Error Code -->
        <h1 class="text-6xl font-bold text-white mb-4">404</h1>

        <!-- Message -->
        <p class="text-xl text-gray-400 mb-8">
            Scan or page not found
        </p>

        <!-- Action Buttons -->
        <div class="flex gap-4 justify-center">
            <a href="/dashboard" 
               class="px-6 py-3 bg-primary-600 hover:bg-primary-700 text-white font-semibold rounded-lg transition-colors">
                <i class="fas fa-home mr-2"></i>
                Back to Dashboard
            </a>
            <a href="/scans" 
               class="px-6 py-3 bg-dark-card hover:bg-dark-border text-white font-semibold rounded-lg border border-dark-border transition-colors">
                <i class="fas fa-list mr-2"></i>
                View Scans
            </a>
        </div>

        <!-- Footer -->
        <div class="mt-12 pt-8 border-t border-dark-border">
            <p class="text-gray-600 text-sm">
                FullMute Web Security Scanner
            </p>
        </div>
    </div>
</div>
{% endblock %}
